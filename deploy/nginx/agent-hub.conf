# ============================================================
# Agent Hub · nginx 反向代理配置
# 放 /etc/nginx/conf.d/agent-hub.conf，把 ai.example.com 换成你的域名
# 证书用 certbot 签发（见 deploy/DEPLOY.md 第 6 步）
# ============================================================

upstream agent_hub {
    server 127.0.0.1:8899;
    keepalive 16;
}

# 登录接口限流：同一 IP 每分钟 10 次，突发 5 次。
# 挡的是脚本撞库，正常人手速永远到不了这个量。
limit_req_zone $binary_remote_addr zone=ah_login:10m rate=10r/m;

# ---------- 80：只做跳转 + 证书续期 ----------
server {
    listen 80;
    server_name ai.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 443：正式入口 ----------
server {
    listen 443 ssl;
    # 想开 HTTP/2（nginx ≥ 1.25.1）就在下面加一行 `http2 on;`。
    # 默认不开是有意的：SSE 走 HTTP/1.1 更省心，且并发不高时没收益。
    server_name ai.example.com;

    ssl_certificate     /etc/letsencrypt/live/ai.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    # 知识库上传上限 30MB（application.yml 里 max-file-size），
    # nginx 默认只有 1MB，不放宽会直接 413
    client_max_body_size 40m;

    # 安全响应头。CSP 没开：页面里有内联样式和 data: 图标，
    # 要开得先改成外链资源，收益不大，先放着。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 以下 proxy_* 写在 server 级，各 location 直接继承。
    # 注意：location 里若再写任何一条 proxy_set_header，会覆盖掉整组继承，
    # 所以这里配齐，下面就不要重复了。
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # 登录：限流 + 不缓存
    location = /api/auth/login {
        limit_req zone=ah_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://agent_hub;
    }

    # 流式对话：SSE 必须关缓冲，否则前端会等模型全部答完才一次性蹦出来。
    # 后端 SseEmitter 超时 5 分钟，这里读超时要比它长。
    location = /api/chat/stream {
        proxy_pass http://agent_hub;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    # 其余全部交给 Spring Boot（静态页和接口都由它出）
    location / {
        proxy_pass http://agent_hub;
    }
}
