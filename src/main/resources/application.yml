server:
  port: 8899
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: agent-hub
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:${AGENT_HUB_DB:./data/agent-hub.db}?journal_mode=WAL&busy_timeout=15000&synchronous=NORMAL
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
      connection-timeout: 30000
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      encoding: UTF-8
      continue-on-error: false
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 32MB
  jackson:
    default-property-inclusion: non_null

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30

logging:
  level:
    root: info
    com.goocidata.agent: info
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

agent-hub:
  # 初始管理员（仅当用户表为空时创建）
  # 密码**不要写默认值**：留空 → 首次启动随机生成 12 位，只在日志里打印一次。
  init-admin:
    username: ${AGENT_HUB_ADMIN_USER:admin}
    password: ${AGENT_HUB_ADMIN_PASSWORD:}
    nickname: ${AGENT_HUB_ADMIN_NICKNAME:系统管理员}
  # 安全相关（公网部署见 deploy/ 目录，prod 配置会覆盖这里）
  security:
    # 是否允许把令牌放在 URL 上（?token=xxx）。本地调试方便，公网必须关
    allow-token-param: true
    # 允许跨域的来源，逗号分隔；* 表示不限。同源部署（nginx 反代）建议留空
    cors-origins: "*"
  # 登录 token 有效期（分钟）
  token-ttl-minutes: 720
  # 单次对话携带的历史消息条数
  history-limit: 10
  # 检索默认参数
  retrieve:
    top-k: 4
    max-chunk-chars: 1200
  # 工具能力：智能体没单独配工作目录时用这个
  tools:
    default-work-dir: ${AGENT_HUB_WORKSPACE:./workspace}
    # 单次工具输出回给模型的字符上限（太小模型看不清，太大费 token）
    max-output: 8000
    # 单次提问最多工具轮次（防止死循环）
    max-steps: 16
    # 单次命令默认超时（秒）
    timeout-seconds: 30
  # Token 消耗控制
  token:
    # 工具结果保留最近几条全文，更早的折叠成一行摘要。
    #
    # 默认 0（关闭），原因是算下来不划算：
    # 折叠会改写历史内容，导致该位置之后的上下文缓存整段失效。
    # 按 DeepSeek 现价，缓存未命中输入是命中的 30 倍、输出的 1/3，
    # 实测「少 30% token 但缓存全失效」总花费反而贵 2.5 倍。
    #
    # 什么时候才值得打开：
    #   1. 上下文逼近模型上限（不折叠会直接报错）；
    #   2. 用的模型服务没有前缀缓存（很多三方中转没有）。
    # 打开后建议 6~10，代码里已做「攒够一批再折叠」的退避，
    # 把缓存失效次数从每轮一次降到每 N 轮一次。
    keep-recent-results: 0
    # 折叠后的摘要最大字符数
    summary-max-chars: 150
